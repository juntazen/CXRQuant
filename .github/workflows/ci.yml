name: cpu-verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements-cpu-lock.txt -r requirements-revision.txt
      - run: python -m pip install --no-deps --no-build-isolation .
      - run: python -m pytest -q
      - run: make verify-all
      - run: make data
      - run: python -m pytest -q tests/test_reproducibility.py
      - run: make revision-summary
